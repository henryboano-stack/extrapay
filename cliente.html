
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXTRAPAY - Acesso</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#071629;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{width:100%;max-width:430px;background:#10243b;padding:28px;border-radius:18px;box-shadow:0 10px 35px #0005}
.logo{text-align:center;font-size:30px;font-weight:bold;color:#20d18b}
.slogan{text-align:center;color:#c4d0dc;margin:8px 0 25px}
.tabs{display:flex;gap:10px;margin-bottom:22px}
.tabs button{flex:1;padding:12px;border:0;border-radius:9px;background:#243c55;color:white;font-weight:bold;cursor:pointer}
.tabs button.active{background:#16a66d}
label{display:block;margin:13px 0 7px;font-size:14px}
input{width:100%;padding:14px;border-radius:9px;border:1px solid #40566e;background:#071629;color:white;font-size:16px;outline:none}
input:focus{border-color:#20d18b}
.mainbtn{width:100%;padding:15px;margin-top:22px;border:0;border-radius:9px;background:#16a66d;color:white;font-weight:bold;font-size:16px;cursor:pointer}
.mainbtn:disabled{opacity:.6}
.message{margin-top:15px;padding:12px;border-radius:8px;display:none;font-size:14px;line-height:1.5}
.error{background:#572b32;color:#ffdce0}
.success{background:#164c3b;color:#c9ffe5}
a{color:#20d18b;text-decoration:none}
.footer{text-align:center;color:#9eafc0;font-size:12px;line-height:1.6;margin-top:22px}
.back{text-align:center;margin-top:18px}
.hidden{display:none}
</style>
</head>
<body>

<div class="container">
  <div class="logo">EXTRAPAY</div>
  <div class="slogan">Extra Income. More Opportunities.</div>

  <div class="tabs">
    <button id="loginTab" class="active" onclick="showLogin()">Entrar</button>
    <button id="registerTab" onclick="showRegister()">Criar conta</button>
  </div>

  <form id="registerForm" class="hidden">
    <label>Nome completo</label>
    <input id="fullName" type="text" placeholder="Meu nome completo" required>

    <label>Número de telefone</label>
    <input id="registerPhone" type="tel" placeholder="973 000 000" required>

    <label>Criar palavra-passe</label>
    <input id="registerPassword" type="password" placeholder="Mínimo de 6 caracteres" minlength="6" required>

    <label>Confirmar palavra-passe</label>
    <input id="confirmPassword" type="password" placeholder="Repetir palavra-passe" required>

    <label>Código de convite (opcional)</label>
    <input id="referralCode" type="text" placeholder="Código de quem o convidou">

    <button class="mainbtn" id="registerButton" type="submit">Criar minha conta</button>
  </form>

  <form id="loginForm">
    <label>Número de telefone</label>
    <input id="loginPhone" type="tel" placeholder="973 000 000" required>

    <label>Palavra-passe</label>
    <input id="loginPassword" type="password" placeholder="A sua palavra-passe" required>

    <button class="mainbtn" id="loginButton" type="submit">Entrar na minha conta</button>
  </form>

  <div id="message" class="message"></div>

  <div class="back">
    <a href="index.html">← Voltar à página inicial</a>
  </div>

  <div class="footer">
    Proteja a sua palavra-passe. Nunca a partilhe com outras pessoas.
    A EXTRAPAY não solicita o seu PIN bancário nem códigos de segurança.
  </div>
</div>

<script>
const SUPABASE_URL = "https://cypuvaynypppvyuchghb.supabase.co";
const SUPABASE_KEY = "sb_publishable_51-sjpu4VSt4SFa2ZgnoFw_Er-MdvOd";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const registerForm = document.getElementById("registerForm");
const loginForm = document.getElementById("loginForm");
const messageBox = document.getElementById("message");

function showMessage(message, type="error"){
  messageBox.textContent = message;
  messageBox.className = "message " + type;
  messageBox.style.display = "block";
}

function hideMessage(){
  messageBox.style.display = "none";
}

function showLogin(){
  hideMessage();
  loginForm.classList.remove("hidden");
  registerForm.classList.add("hidden");
  document.getElementById("loginTab").classList.add("active");
  document.getElementById("registerTab").classList.remove("active");
}

function showRegister(){
  hideMessage();
  registerForm.classList.remove("hidden");
  loginForm.classList.add("hidden");
  document.getElementById("registerTab").classList.add("active");
  document.getElementById("loginTab").classList.remove("active");
}

// Normalizar números angolanos
function normalizePhone(value){
  let digits = value.replace(/\D/g, "");

  if(digits.startsWith("244") && digits.length === 12){
    return "+" + digits;
  }

  if(digits.length === 9){
    return "+244" + digits;
  }

  return null;
}

// Criar identificador interno a partir do telefone
function createInternalEmail(phone){
  const digits = phone.replace(/\D/g, "");
  return "ang" + digits + "@extrapay-login.com";
}

// Verificar sessão existente
async function checkSession(){
  const {data, error} = await supabaseClient.auth.getSession();

  if(!error && data.session){
    window.location.href = "painel.html";
  }
}
checkSession();

// REGISTO
registerForm.addEventListener("submit", async function(e){
  e.preventDefault();
  hideMessage();

  const name = document.getElementById("fullName").value.trim();
  const phone = normalizePhone(
    document.getElementById("registerPhone").value
  );
  const password = document.getElementById("registerPassword").value;
  const confirm = document.getElementById("confirmPassword").value;
  const referral = document.getElementById("referralCode").value.trim();

  if(!name){
    showMessage("Introduza o seu nome completo.");
    return;
  }

  if(!phone){
    showMessage("Introduza um número angolano válido com 9 dígitos ou indicativo +244.");
    return;
  }

  if(password.length < 6){
    showMessage("A palavra-passe deve ter pelo menos 6 caracteres.");
    return;
  }

  if(password !== confirm){
    showMessage("As palavras-passe não coincidem.");
    return;
  }

  const button = document.getElementById("registerButton");
  button.disabled = true;
  button.textContent = "A criar conta...";

  try{
    const internalEmail = createInternalEmail(phone);

    const {data, error} = await supabaseClient.auth.signUp({
      email: internalEmail,
      password: password,
      options:{
        data:{
          full_name: name,
          phone: phone,
          referral_code: referral
        }
      }
    });

    if(error) throw error;

    if(!data.session){
      showMessage(
        "A conta foi criada, mas não foi iniciada sessão. Verifique se a confirmação de e-mail está desactivada no Supabase.",
        "error"
      );
      return;
    }

    showMessage("Conta criada com sucesso! A entrar...", "success");

    setTimeout(function(){
      window.location.href = "painel.html";
    }, 1200);

  }catch(error){
    showMessage("Erro no cadastro: " + error.message);
  }finally{
    button.disabled = false;
    button.textContent = "Criar minha conta";
  }
});

// LOGIN
loginForm.addEventListener("submit", async function(e){
  e.preventDefault();
  hideMessage();

  const phone = normalizePhone(
    document.getElementById("loginPhone").value
  );
  const password = document.getElementById("loginPassword").value;

  if(!phone){
    showMessage("Introduza um número angolano válido.");
    return;
  }

  const button = document.getElementById("loginButton");
  button.disabled = true;
  button.textContent = "A verificar...";

  try{
    const internalEmail = createInternalEmail(phone);

    const {data, error} = await supabaseClient.auth.signInWithPassword({
      email: internalEmail,
      password: password
    });

    if(error) throw error;

    window.location.href = "painel.html";

  }catch(error){
    showMessage("Erro no acesso: " + error.message);
  }finally{
    button.disabled = false;
    button.textContent = "Entrar na minha conta";
  }
});
</script>

</body>
</html>
